name: community-ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m compileall runtime scripts
      - run: pytest -q
      - name: Verify source manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          for line in Path('SOURCE_MANIFEST.sha256').read_text().splitlines():
              digest, rel = line.split('  ',1)
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest, rel
          print('source manifest PASS')
          PY
